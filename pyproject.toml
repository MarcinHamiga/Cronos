[project]
name = "cronos"
version = "0.1.0"
description = "A team-based RPG game"
authors = [
    {name = "Marcin Hamiga",email = "marcin.hamiga@proton.me"}
]
requires-python = ">=3.11"
dependencies = [
    "pygame (>=2.6.1,<3.0.0)",
    "pytmx (>=3.32,<4.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
